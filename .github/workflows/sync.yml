name: Safe Sync Code & Wiki to Org

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push directly (remove extraheader first)
        env:
          TOKEN: ${{ secrets.FARVERGE_ORG_TOKEN }}
        run: |
          # 关键：在同一个 shell 会话中移除认证头并推送
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local credential.helper ""
          
          # 直接推送（不使用 remote）
          git push --force-with-lease \
            https://x-access-token:${TOKEN}@github.com/Farverge/DSH-MacOS.git \
            main:main

  sync-wiki:
    runs-on: ubuntu-latest
    needs: sync-code
    steps:
      - name: Checkout source wiki
        uses: actions/checkout@v4
        with:
          repository: iiiiiei/DSH-MacOS.wiki
          path: source-wiki

      - name: Clone and sync target wiki
        env:
          TOKEN: ${{ secrets.FARVERGE_ORG_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Farverge/DSH-MacOS.wiki.git target-wiki
          rsync -av --delete --exclude='.git/' source-wiki/ target-wiki/
          cd target-wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Sync wiki from source"
          git push
