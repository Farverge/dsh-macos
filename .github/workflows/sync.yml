name: Safe Sync Code & Wiki to Org

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 第一步：直接测试 Token 是否有效（用 GitHub API）
      - name: Test token permissions via API
        env:
          TOKEN: ${{ secrets.FARVERGE_ORG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ Token is EMPTY! Please set FARVERGE_ORG_TOKEN secret."
            exit 1
          fi
          echo "✅ Token exists (length: ${#TOKEN})"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/Farverge/DSH-MacOS)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Token has read access to target repo."
          elif [ "$RESPONSE" -eq 403 ]; then
            echo "❌ Token does NOT have permission to target repo (403). Please regenerate classic token with 'repo' scope."
            exit 1
          else
            echo "⚠️ Unexpected HTTP response: $RESPONSE"
            exit 1
          fi

      # 第二步：添加远程并尝试推送（使用 Token）
      - name: Add target repo as remote
        run: |
          git remote add org https://x-access-token:${{ secrets.FARVERGE_ORG_TOKEN }}@github.com/Farverge/DSH-MacOS.git

      - name: Fetch target (ignore if empty)
        run: |
          git fetch org main || echo "Target branch not found, will push from scratch"

      - name: Push safely (no force)
        run: |
          git push -u org main || git push -u org main --force-with-lease
