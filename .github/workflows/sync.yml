name: Safe Sync Code & Wiki to Org

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 任务1：同步代码（含调试步骤）
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 新增调试步骤：检查 Token 是否存在并输出长度
      - name: Debug - Check if token secret exists
        run: |
          if [ -n "${{ secrets.FARVERGE_ORG_TOKEN }}" ]; then
            echo "✅ Token exists (length: $(echo -n '${{ secrets.FARVERGE_ORG_TOKEN }}' | wc -c))"
          else
            echo "❌ Token is EMPTY!"
            exit 1
          fi

      - name: Add target repo as remote
        run: |
          git remote add org https://x-access-token:${{ secrets.FARVERGE_ORG_TOKEN }}@github.com/Farverge/DSH-MacOS.git

      - name: Fetch latest state of target repo
        run: |
          git fetch org main || echo "Target branch not found (repo may be empty)"

      - name: Push safely (no force)
        run: |
          git push org main

  # 任务2：同步 Wiki（保持不变）
  sync-wiki:
    runs-on: ubuntu-latest
    needs: sync-code
    steps:
      - name: Checkout source wiki
        uses: actions/checkout@v4
        with:
          repository: iiiiiei/DSH-MacOS.wiki
          path: source-wiki

      - name: Clone target wiki
        env:
          SYNC_TOKEN: ${{ secrets.FARVERGE_ORG_TOKEN }}
        run: |
          git clone https://x-access-token:${SYNC_TOKEN}@github.com/Farverge/DSH-MacOS.wiki.git target-wiki

      - name: Sync wiki content
        run: |
          rsync -av --delete --exclude='.git/' source-wiki/ target-wiki/

      - name: Commit and push
        working-directory: target-wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Sync wiki from source"
          git push
